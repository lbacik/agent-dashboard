[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "agent-dashboard"
version = "0.1.0"
description = "Read-only web dashboard for a fleet of simple-coding-agent containers on one Docker host."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
  "fastapi>=0.115",
  "uvicorn>=0.30",
  "jinja2>=3.1",
  "httpx>=0.27",
]

[project.optional-dependencies]
dev = [
  "pytest>=8",
  "ruff>=0.8",
  "httpx>=0.27",
]

[project.scripts]
agent-dashboard = "agent_dashboard.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/agent_dashboard"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
