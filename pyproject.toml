[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "agent-dashboard"
version = "0.4.1"
description = "Web dashboard for a fleet of simple-coding-agent containers on one Docker host, with optional control actions (read-only with control off) and optional LAN mode with sign-in."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
  "fastapi==0.162.0",
  "uvicorn>=0.30",
  "jinja2>=3.1",
  "httpx>=0.27",
  "argon2-cffi>=25.1.0",
  # Contract path (ADR 0014): pinned tag; only the library's pure parts are
  # used (DTOs/validation, argv grammar, envelope classification, capability
  # and request-ID checks). Execution stays in the gateway's async runner.
  "agent-operator-contract @ git+https://github.com/lbacik/agent-operator-contract.git@v1.0.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8",
  "ruff>=0.8",
  "httpx>=0.27",
]

[project.scripts]
agent-dashboard = "agent_dashboard.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/agent_dashboard"]

[tool.hatch.metadata]
# Allowed: the contract path pins agent-operator-contract to its v1.0.0 tag
# (ADR 0014) as a direct git reference.
allow-direct-references = true

[tool.uv]
# Transitive via httpx. Floor excludes the compromised emSign ECC Root CA - G3
# (GHSA-6q48-6c7w-9gw2 / WS-2026-0133), removed in certifi 2026.10.19.
constraint-dependencies = ["certifi>=2026.10.19"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
