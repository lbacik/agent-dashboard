{% extends "base.html" %}
{% block content %}
<div id="live"
     hx-ext="sse"
     sse-connect="/stream">
  <div id="fleet"
       sse-swap="fleet"
       hx-swap="innerHTML">
    {% include "_fleet_table.html" %}
  </div>
  <div id="drawer-holder">
    {% if drawer_open %}
    {% include "_drawer.html" %}
    {% endif %}
  </div>
</div>
<noscript>
  <p class="hint">Enable JavaScript for live updates; otherwise reload the page.</p>
</noscript>
<script src="/static/drawer.js" defer></script>
{% endblock %}
